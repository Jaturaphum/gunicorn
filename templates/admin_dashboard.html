<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2>ระบบจัดการลิงก์ติดตาม Session</h2>
        <form action="/api/create-link" method="post">
          <button type="submit" class="btn-primary">
            + สร้าง Unique Link ใหม่
          </button>
        </form>
      </div>

      <div class="card">
        <h3>รายการลิงก์ทั้งหมด</h3>
        {% if links_db %}
        <ul class="link-list">
          {% for link_id, visits in links_db.items() %}
          <li class="link-item">
            <div>
              <strong>Link ID:</strong> <code>/track/{{ link_id }}</code>
              <span class="badge">{{ visits|length }} เข้าชม</span>
            </div>
            <div>
              <a
                href="/track/{{ link_id }}"
                target="_blank"
                style="margin-right: 12px"
                >เปิดลิงก์</a
              >
              <a
                href="/admin/stats/{{ link_id }}"
                class="btn-primary"
                style="padding: 6px 12px; font-size: 13px"
                >ดูสถิติ</a
              >
            </div>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p style="color: var(--text-muted)">ยังไม่มีการสร้างลิงก์ในระบบ</p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
